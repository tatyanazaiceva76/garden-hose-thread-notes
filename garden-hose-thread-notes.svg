<text x="44" y="48" font-size="13" font-weight="bold" letter-spacing="2">HOSE THREAD MATCH · PRACTICAL NOTES</text>
<text x="44" y="88" font-size="30" font-weight="bold">Garden hose thread evidence</text>
<text x="44" y="114" font-size="14">Keep Part A and Part B separate. Unknown stays unknown.</text>
<rect x="44" y="134" width="706" height="60" rx="4" fill="#f3efe3"/>
<text x="58" y="158" font-size="14" font-weight="bold">Not a thread gauge. Do not force a fitting.</text>
<text x="58" y="180" font-size="12">Turn off and depressurise before disconnecting; follow the equipment instructions.</text>
<text x="44" y="225" font-size="17" font-weight="bold">What to record</text>
