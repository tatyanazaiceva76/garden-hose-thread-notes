<title id="title">Garden hose thread evidence worksheet</title><desc id="desc">Blank A4 notes for two fitting ends. Record markings, male or female threads, male outside diameter, pitch, method and uncertainties. This is not a thread gauge or a fit certificate. All illustrations are not to scale.</desc>
